name: Unit tests

# Checks that need no PXC/PS server: every Python file compiles without
# warnings, and the unit tests in test/ pass. Cluster suites still run in
# Jenkins.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version the code runs on (it uses list[...] hints).
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile every Python file (warnings are errors)
        run: python -W error -m compileall -q -f .

      - name: Import every library module (without setuptools)
        # Catches imports that break on a clean host, such as distutils,
        # which Python 3.12 removed and only setuptools still provides.
        run: |
          # 9.2+ needs OpenSSL 3.2, newer than Ubuntu 22.04/24.04 ship; the test
          # hosts use 9.1.0 for the same reason.
          python -m pip install --quiet mysql-connector-python==9.1.0
          python -m pip uninstall --yes --quiet setuptools || true
          python - <<'EOF'
          import importlib, pathlib, sys
          sys.path.insert(0, '.')  # repository root
          # Standalone scripts that do work as soon as they are imported.
          skip = {'data_generator', 'pxc_util'}
          modules = ['config', 'qa_framework'] + sorted(
              'util.' + path.stem for path in pathlib.Path('util').glob('*.py')
              if path.stem not in skip and path.stem != '__init__')
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as error:
                  failed.append(name)
                  print('FAILED ' + name + ': ' + repr(error))
          print('imported %d/%d modules' % (len(modules) - len(failed), len(modules)))
          sys.exit(1 if failed else 0)
          EOF

      - name: Run unit tests
        run: |
          status=0
          for t in test/test_*.py; do
            # test_startup.py drives a real cluster; it is not a unit test.
            [ "$t" = test/test_startup.py ] && continue
            echo "::group::$t"
            python "$t" -v || status=1
            echo "::endgroup::"
          done
          exit $status
